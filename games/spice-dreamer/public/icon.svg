<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Spice Dreamer icon: a sandworm's maw rising out of the spice trail at sunset, as 32x32 pixel art -->
  <rect width="32" height="32" fill="#1e0b3a"/>
  <rect y="6" width="32" height="4" fill="#3a1256"/>
  <rect y="10" width="32" height="3" fill="#651a66"/>
  <rect y="13" width="32" height="3" fill="#9c2462"/>
  <rect y="16" width="32" height="2" fill="#d2434e"/>
  <!-- sun -->
  <rect x="21" y="8" width="6" height="1" fill="#fff2a8"/>
  <rect x="20" y="9" width="8" height="2" fill="#ffe08a"/>
  <rect x="19" y="11" width="10" height="2" fill="#ffc07a"/>
  <rect x="19" y="14" width="10" height="2" fill="#ff8f6e"/>
  <!-- sand and the glowing trail -->
  <rect y="18" width="32" height="14" fill="#c66a38"/>
  <rect y="22" width="32" height="6" fill="#ff7a1c"/>
  <rect y="24" width="32" height="2" fill="#ffc04a"/>
  <rect x="2" y="24" width="3" height="1" fill="#fff0a0"/>
  <rect x="26" y="25" width="3" height="1" fill="#fff0a0"/>
  <!-- worm body -->
  <rect x="3" y="17" width="12" height="7" fill="#3e2418"/>
  <rect x="4" y="16" width="10" height="7" fill="#a06c48"/>
  <rect x="6" y="16" width="1" height="7" fill="#3e2418"/>
  <rect x="10" y="16" width="1" height="7" fill="#3e2418"/>
  <rect x="5" y="17" width="4" height="1" fill="#c89464"/>
  <!-- head with its round maw -->
  <rect x="12" y="10" width="11" height="14" fill="#3e2418"/>
  <rect x="13" y="11" width="9" height="13" fill="#a06c48"/>
  <rect x="14" y="12" width="3" height="2" fill="#c89464"/>
  <rect x="18" y="13" width="5" height="9" fill="#2a0a08"/>
  <rect x="19" y="15" width="3" height="5" fill="#8a1c12"/>
  <!-- teeth -->
  <rect x="18" y="13" width="1" height="1" fill="#fff4dc"/>
  <rect x="20" y="13" width="1" height="1" fill="#fff4dc"/>
  <rect x="22" y="14" width="1" height="1" fill="#fff4dc"/>
  <rect x="22" y="17" width="1" height="1" fill="#fff4dc"/>
  <rect x="22" y="20" width="1" height="1" fill="#fff4dc"/>
  <rect x="20" y="21" width="1" height="1" fill="#fff4dc"/>
  <rect x="18" y="21" width="1" height="1" fill="#fff4dc"/>
  <rect x="18" y="17" width="1" height="1" fill="#fff4dc"/>
  <!-- sand spray -->
  <rect x="24" y="19" width="1" height="1" fill="#ffd9a0"/>
  <rect x="25" y="21" width="1" height="1" fill="#ffd9a0"/>
  <rect x="11" y="25" width="1" height="1" fill="#ffd9a0"/>
</svg>
