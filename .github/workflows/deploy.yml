name: Build & deploy

# Only run when something that ends up on the site changes.
on:
  push:
    branches: [main]
    paths:
      - 'games/**'
      - 'site/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'games/**'
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every folder under games/ is a standalone Vite project; adding a game needs no workflow edits.
  discover:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.list.outputs.games }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: echo "games=$(ls -d games/*/ | xargs -n1 basename | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJson(needs.discover.outputs.games) }}
    defaults:
      run:
        working-directory: games/${{ matrix.game }}
    steps:
      - uses: actions/checkout@v5

      # The build output is cached under a hash of the game's own files. If nothing in
      # games/<game>/ changed since the last build, dist/ is restored and the build is skipped.
      # Bump the "v1" to force every game to rebuild (e.g. after changing the Node version).
      - id: cache
        uses: actions/cache@v4
        with:
          path: games/${{ matrix.game }}/dist
          key: dist-v1-${{ matrix.game }}-${{ hashFiles(format('games/{0}/**', matrix.game)) }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/${{ matrix.game }}/package-lock.json

      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.game }}
          path: games/${{ matrix.game }}/dist
          retention-days: 1

  # Pages deploys replace the whole site, so every game's dist (fresh or cached) is combined here.
  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: game-*
          path: _artifacts
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          for dir in _artifacts/game-*; do
            cp -r "$dir" "_site/${dir#_artifacts/game-}"
          done
          find _site -maxdepth 2 | sort
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: assemble
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
